<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#05070d"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Elite Cell</title>
<style>
:root{--bg:#05070d;--bg2:#0b101c;--card:#101726;--line:#1e2a44;--blue:#1e90ff;--text:#eef4ff;--muted:#8ea0c0;--ok:#3dd68c;--danger:#ff5d6c;--warn:#f5c542;--radius:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:rgba(30,144,255,.35)}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,sans-serif}
button,input,select,textarea{font:inherit;color:inherit;touch-action:manipulation}
.btn{background:var(--blue);color:#041018;border:0;border-radius:12px;padding:12px 14px;font-weight:700;min-height:44px}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#052015}
.btn.danger{background:var(--danger);color:#1a0508}
.wrap{padding:12px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:8;background:#05070d;padding:12px;padding-top:max(12px,env(safe-area-inset-top));display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.brand{font-weight:800;flex:1}.brand span{color:var(--blue)}
.tabs{display:flex;gap:6px;overflow:auto;padding:8px 12px;-webkit-overflow-scrolling:touch}
.tabs button{flex:0 0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 10px}
.muted{color:var(--muted);font-size:13px}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#142033;color:#7eb8ff}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:var(--blue);color:#041018;border:0;border-radius:999px;padding:16px 20px;font-weight:800;z-index:20}
.hidden{display:none!important}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:flex;align-items:flex-end}
.modal{background:var(--bg2);width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat .k{color:var(--muted);font-size:12px}.stat .v{font-size:24px;font-weight:800}
</style></head>
<body>
<div class="top"><div class="brand">ELITE <span>CELL</span></div></div>
<div class="tabs" id="tabs"></div>
<div class="wrap" id="app"></div>
<button class="fab" id="fab" type="button">+ OS</button>
<div id="modalRoot"></div>
<script>
const STATUS=[{id:'aguardando_orcamento',l:'Aguardando orçamento'},{id:'aprovado',l:'Aprovado'},{id:'aguardando_peca',l:'Aguardando peça'},{id:'em_reparo',l:'Em reparo'},{id:'pronto',l:'Pronto'},{id:'entregue',l:'Entregue'},{id:'recusado',l:'Recusado'}];
const KEY='elitecell_v2';
const uid=()=>String(Date.now()+Math.random());
const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const today=()=>new Date().toISOString().slice(0,10);
const sl=id=>(STATUS.find(s=>s.id===id)||{}).l||id;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[m]));
function load(){
  try{
    const raw=localStorage.getItem(KEY)||localStorage.getItem('elitecell_v1');
    const base={clientes:[],os:[],produtos:[],caixa:[],tecnicos:[],vendedores:[],modelosOS:[],seq:1,loja:{nome:'Elite Cell',cnpj:'56.184.927/0001-83',whatsapp:'',senhaLoja:''}};
    if(!raw) return base;
    return Object.assign(base,JSON.parse(raw),{loja:Object.assign(base.loja,(JSON.parse(raw).loja||{}))});
  }catch(e){return {clientes:[],os:[],produtos:[],caixa:[],tecnicos:[],vendedores:[],modelosOS:[],seq:1,loja:{}};} 
}
let DB=load(), VIEW='dash';
const save=()=>localStorage.setItem(KEY,JSON.stringify(DB));
const cli=id=>DB.clientes.find(x=>x.id===id);
function tabs(){
  const t=[['dash','Início'],['os','OS'],['clientes','Clientes'],['estoque','Estoque'],['fin','Caixa'],['rel','Loja']];
  document.getElementById('tabs').innerHTML=t.map(([id,n])=>'<button type="button" class="btn '+(VIEW===id?'':'ghost')+'" data-go="'+id+'">'+n+'</button>').join('');
}
function go(v){VIEW=v;tabs();render();}
function render(){
  if(VIEW==='dash'){
    const ab=DB.os.filter(o=>!['entregue','recusado'].includes(o.status));
    app.innerHTML='<div class="grid"><div class="stat"><div class="k">Em andamento</div><div class="v">'+ab.length+'</div></div><div class="stat"><div class="k">Prontos</div><div class="v">'+DB.os.filter(o=>o.status==="pronto").length+'</div></div></div><button type="button" class="btn" id="bCli">+ Cliente</button> <button type="button" class="btn ghost" id="bOS">+ OS</button><p class="muted" style="margin-top:12px">1) Cadastre um cliente. 2) Toque + OS.</p>';
  } else if(VIEW==='clientes'){
    app.innerHTML='<button type="button" class="btn" id="bCli">+ Cliente</button>'+(DB.clientes.map(c=>'<div class="card"><b>'+esc(c.nome)+'</b><div class="muted">'+esc(c.telefone||'')+'</div></div>').join('')||'<p class="muted">Nenhum cliente.</p>');
  } else if(VIEW==='os'){
    app.innerHTML='<button type="button" class="btn" id="bOS">+ OS</button>'+(DB.os.slice().reverse().map(o=>'<div class="card" data-os="'+o.id+'"><b>'+esc(o.numero)+'</b> <span class="badge">'+esc(sl(o.status))+'</span><div>'+esc((cli(o.clienteId)||{}).nome||'')+' · '+esc(o.marca||'')+' '+esc(o.modelo||'')+'</div></div>').join('')||'<p class="muted">Nenhuma OS.</p>');
  } else if(VIEW==='estoque'){
    app.innerHTML='<button type="button" class="btn" id="bProd">+ Peça</button>'+(DB.produtos.map(p=>'<div class="card"><b>'+esc(p.nome)+'</b><div class="muted">Qtd '+p.qtd+' · '+money(p.preco)+'</div></div>').join('')||'<p class="muted">Vazio.</p>');
  } else if(VIEW==='fin'){
    app.innerHTML='<button type="button" class="btn ok" id="bIn">+ Entrada</button> <button type="button" class="btn danger" id="bOut">+ Saída</button>'+DB.caixa.slice().reverse().slice(0,20).map(c=>'<div class="card">'+esc(c.data)+' · '+esc(c.descricao)+' · '+money(c.valor)+'</div>').join('');
  } else {
    app.innerHTML='<div class="card"><label>WhatsApp da loja</label><input id="lw" value="'+esc(DB.loja.whatsapp||'')+'"><label>CNPJ PIX</label><input id="lc" value="'+esc(DB.loja.cnpj||'')+'"><button type="button" class="btn" id="bSave">Salvar</button></div>';
  }
}
function modal(t,h){modalRoot.innerHTML='<div class="modal-bg" id="mbg"><div class="modal"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">'+t+'</h3><button type="button" class="btn ghost" id="bClose">Fechar</button></div>'+h+'</div></div>';}
function closeM(){modalRoot.innerHTML='';}
function formCli(){modal('Cliente','<label>Nome</label><input id="n"><label>Telefone</label><input id="t" inputmode="tel"><button type="button" class="btn" id="bSaveCli">Salvar cliente</button>');}
function saveCli(){
  const nome=(document.getElementById('n')||{}).value||'';
  if(!nome.trim()) return;
  DB.clientes.push({id:uid(),nome:nome.trim(),telefone:(document.getElementById('t')||{}).value||''});
  save(); closeM(); go('clientes');
}
function formOS(){
  if(!DB.clientes.length){ go('clientes'); formCli(); return; }
  modal('Nova OS','<label>Cliente</label><select id="oc">'+DB.clientes.map(c=>'<option value="'+c.id+'">'+esc(c.nome)+'</option>').join('')+'</select><label>Marca</label><input id="oma"><label>Modelo</label><input id="omo"><label>IMEI</label><input id="oi"><label>Defeito</label><textarea id="od"></textarea><label>Valor</label><input id="ov" type="number" inputmode="decimal"><button type="button" class="btn" id="bSaveOS">Salvar OS</button>');
}
function saveOS(){
  DB.os.push({id:uid(),numero:'OS-'+new Date().getFullYear()+'-'+String(DB.seq++).padStart(4,'0'),clienteId:oc.value,marca:oma.value,modelo:omo.value,imei:oi.value,defeito:od.value,valorOrcamento:Number(ov.value||0),status:'aguardando_orcamento',createdAt:new Date().toISOString()});
  save(); closeM(); go('os');
}
function formProd(){modal('Peça','<label>Nome</label><input id="pn"><label>Qtd</label><input id="pq" type="number" value="1"><label>Venda</label><input id="pp" type="number"><button type="button" class="btn" id="bSaveP">Salvar</button>');}
function saveProd(){if(!pn.value.trim())return;DB.produtos.push({id:uid(),nome:pn.value.trim(),qtd:Number(pq.value||0),preco:Number(pp.value||0)});save();closeM();go('estoque');}
function formCx(tipo){modal(tipo==='entrada'?'Entrada':'Saída','<label>Valor</label><input id="xv" type="number" inputmode="decimal"><label>Descrição</label><input id="xd"><button type="button" class="btn" id="bSaveX">Lançar</button>'); document.getElementById('bSaveX').onclick=()=>{DB.caixa.push({id:uid(),tipo,valor:Number(xv.value||0),data:today(),descricao:xd.value});save();closeM();go('fin');};}
document.body.addEventListener('click',function(e){
  const b=e.target.closest('button');
  if(!b) {
    const card=e.target.closest('[data-os]');
    if(card){
      const o=DB.os.find(x=>x.id===card.getAttribute('data-os'));
      if(o) modal(o.numero,'<p>'+esc(sl(o.status))+'</p><label>Status</label><select id="nst">'+STATUS.map(s=>'<option value="'+s.id+'" '+(o.status===s.id?'selected':'')+'>'+s.l+'</option>').join('')+'</select><button type="button" class="btn" id="bSt">Atualizar</button>');
      const bs=document.getElementById('bSt'); if(bs) bs.onclick=()=>{o.status=nst.value;save();closeM();go('os');};
    }
    if(e.target.id==='mbg') closeM();
    return;
  }
  const g=b.getAttribute('data-go'); if(g) return go(g);
  if(b.id==='bCli'||b.id==='fab'&&!DB.clientes.length) return formCli();
  if(b.id==='bOS'||b.id==='fab') return formOS();
  if(b.id==='bClose') return closeM();
  if(b.id==='bSaveCli') return saveCli();
  if(b.id==='bSaveOS') return saveOS();
  if(b.id==='bProd') return formProd();
  if(b.id==='bSaveP') return saveProd();
  if(b.id==='bIn') return formCx('entrada');
  if(b.id==='bOut') return formCx('saida');
  if(b.id==='bSave'){DB.loja.whatsapp=lw.value;DB.loja.cnpj=lc.value;save();b.textContent='Salvo';}
});
tabs(); render();
</script>
</body></html>
